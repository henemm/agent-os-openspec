# OpenSpec Framework Configuration v3.0
# ======================================
# Central configuration for the 8-phase workflow enforcement system.
# v3: Consolidated hooks, isolated workflow state.
#
# Copy this file to your project root as openspec.yaml and customize.

# Global switch (#132). `enabled: false` turns the workflow ENFORCEMENT off for
# this project — phases, spec requirement, TDD gate, approval gate, stop-lock.
# The protective guards keep running: secrets, hardcoded credentials,
# CLAUDE.md protection, the worktree write guard.
#
# Use this instead of Claude Code's `enabledPlugins: false`: that setting is
# read per directory and is untracked, so a git worktree does not inherit it and
# every gate fires again. This file is resolved through find_project_root(),
# which maps a worktree back to the main repo, so it covers the main checkout,
# every worktree and every fresh clone.
#
# Only an explicit `false` disables anything — see README, "Switching the
# framework off for a project". Also available as OPENSPEC_FRAMEWORK=off for a
# single session.
framework:
  enabled: true

# Project Information
project:
  name: "My Project"
  base_path: "/path/to/project"  # Will be auto-detected if not set

# Workflow Configuration (v3)
workflow:
  # 10 phases including phase6b_adversary
  phases:
    - phase0_idle
    - phase1_context
    - phase2_analyse
    - phase3_spec
    - phase4_approved
    - phase5_tdd_red
    - phase6_implement
    - phase6b_adversary
    - phase7_validate
    - phase8_complete

  # Phases that allow code modification (used by edit_gate.py)
  code_modify_phases:
    - phase6_implement
    - phase6b_adversary
    - phase7_validate
    - phase8_complete

  # Phrases that trigger spec approval (case-insensitive, word-boundary matched).
  # Wirken NUR in phase3_spec — in jeder anderen Phase warnt phase_listener und
  # laesst den Zustand unveraendert (Issue #90).
  #
  # Satzbau-Regel (Issue #170) fuer approval_phrases, green_phrases UND die
  # override_token-Keywords: Die Phrase muss die erste Zeile eroeffnen (hoechstens
  # EIN Fuellwort davor: ja/ok/okay/yes/klar/danke/super/top), danach duerfen bis
  # zum ersten Satz-/Klauselzeichen hoechstens 2 Zusatzwoerter folgen (override: 0).
  # Fragezeichen, Negation/Einschraenkung (nicht, kein, aber, warte …) und eine
  # fuehrende Ziffer ("1. …") verwerfen die Freigabe; Klammer-Einschuebe werden
  # ignoriert. Eine blosse Erwaehnung mitten im Satz ist damit keine Freigabe mehr.
  # Faustregel fuer eigene Listen: kurze, eindeutige Kommandowoerter waehlen.
  approval_phrases:
    - "approved"
    - "freigabe"
    - "spec ok"
    - "lgtm"
    - "looks good"
    - "genehmigt"
    - "abgenommen"
    - "passt"
    - "sieht gut aus"

  # Phrases that trigger GREEN approval after implementation.
  # Wirken NUR in phase6_implement und phase6b_adversary.
  green_phrases:
    - "go"
    - "green ok"
    - "tests ok"
    - "gruen ok"

# Edit Gate — Controls which code files can be edited and when
# Used by edit_gate.py (consolidated PreToolUse Edit|Write hook)
strict_code_gate:
  code_extensions:
    - ".swift"
    - ".kt"
    - ".java"
    - ".py"
    - ".js"
    - ".ts"
    - ".tsx"
    - ".jsx"
    - ".go"
    - ".rs"
    - ".cpp"
    - ".c"
    - ".h"
    - ".hpp"
    - ".rb"
    - ".php"
    - ".cs"
  always_allowed_dirs:
    - "Tests/"
    - "UITests/"
    - "Test/"
    - "test/"
    - "tests/"
    - "__tests__/"
    - "spec/"
    - "docs/"
    - ".claude/commands/"
    - "scripts/"
    - "tools/"
  always_allowed_patterns:
    - "\\.md$"
    - "\\.txt$"
    - "\\.json$"
    - "\\.yaml$"
    - "\\.yml$"
    - "\\.toml$"
    - "\\.gitignore$"
    - "README"
    - "CHANGELOG"
    - "LICENSE"
  # Zusaetzliche Infrastruktur-Verzeichnisse: Aenderungen daran verlangen einen
  # Override-Token ("override" tippen, gilt 1 h). ERGAENZT die eingebauten
  # Defaults (.claude/hooks/, .claude/agents/) — ersetzt sie nicht.
  # Nur setzen, wenn ein Projekt Hooks/Agenten ausserhalb von .claude/ ablegt.
  # infrastructure_dirs:
  #   - "lib/gates/"

# Secrets Guard — Prevents accidental exposure of sensitive files
# Used by secrets_guard.py and bash_gate.py (shared source: core/hooks/hook_utils.py
# ::SECRETS_SENSITIVE_PATTERNS / SECRETS_ALWAYS_BLOCKED). Muster hier MUESSEN mit dem
# Code-Default uebereinstimmen (tests/test_config_yaml_secrets_pattern_drift_145.py
# prueft das) — ein Feld, das hier gesetzt ist, gewinnt in _get_config() gegen den
# Code-Default. Die alten unverankerten Formen `_key`/`_secret` (Issue #145) blockierten
# jede Datei mit "key"/"secret" als Substring im Namen (z.B. "...keyword_guard.py").
secrets_guard:
  sensitive_patterns:
    - "\\.env(rc)?\\b"
    - "credentials\\.json"
    - "service[_-]?account.*\\.json"
    - "private[_.]key"
    - "[_.]secret\\."
    - "\\.pem$"
    - "\\.key$"
  always_blocked:  # Even in staging mode
    - "credentials\\.json"
    - "service[_-]?account.*\\.json"
    - "private[_.]key"
    - "[_.]secret\\."
    - "\\.pem$"
    - "\\.key$"

# Secret Egress Guard — Prevents secret VALUES from leaving via tool output
# Used by secret_egress_guard.py. redirect_guard_enabled/extra_allowed_write_dirs (Issue #97)
# MUESSEN mit dem Code-Default in _get_config() uebereinstimmen (dieselbe Drift-Klasse wie
# #145/#146: ein hier gesetztes Feld gewinnt gegen den Code-Default) — leer/true sind hier
# UND im Code der Default, es gibt also aktuell nichts, das auseinanderlaufen koennte.
secret_egress_guard:
  redirect_guard_enabled: true
  extra_allowed_write_dirs: []  # Regex-Muster, z.B. ["^/tmp/claude-\\d+/"] fuers eigene Scratchpad

# Credentials Guard — Detects hardcoded secrets in bash commands
# Used by bash_gate.py (step 4b). Empty patterns list = use built-in defaults.
credentials_guard:
  patterns: []

# E2E Scope Detection — Classifies commits by scope for downstream E2E routing
# Used by bash_gate.py (step 5c) — writes e2e_scope to workflow state, never blocks
# Scope values: docs-only | frontend-only | backend | full-stack
e2e_scope:
  docs_patterns:
    - '^docs/'
    - '\.md$'
    - '^\.claude/'
  frontend_patterns:
    - '^(frontend|ui|client)/'
    - '^src/.*\.(svelte|vue|tsx|jsx|css|scss|html)$'
  backend_patterns:
    - '^(src|api|internal|cmd|backend|server)/'

# Bug Fix Fast Track — Lightweight workflow for small, well-understood bugs
# Activated via: workflow.py start <name> --type bug
bug_fix:
  require_tdd: false    # true → TDD-Red-Artefakt auch bei Bug-Workflows erforderlich
  max_files: 5          # Warnung (kein Block) wenn Fix mehr Dateien berührt

# Pre-commit Gate — Checks before git commit is allowed
# Used by bash_gate.py
pre_commit:
  required_staged_files: []  # Files that MUST be staged (e.g., ["docs/ACTIVE-todos.md"])

# Stop Lock — Pause all operations on user command
# Used by edit_gate.py, bash_gate.py, phase_listener.py
stop_lock:
  stop_keywords:
    - "stop"
    - "stopp"
    - "halt"
  resume_keywords:
    - "resume"
    - "weiter"
    - "continue"
    - "weitermachen"

# Override Token — One-time gate bypass
# Used by edit_gate.py, phase_listener.py
override_token:
  keywords:
    - "override"
    - "ueberschreiben"
    - "ich genehmige"

# TDD Enforcement
tdd:
  max_artifact_age_hours: 24
  artifact_categories:
    default:
      min_artifacts: 1
      types:
        - screenshot
        - email
        - api_response
        - log
        - file
        - test_output
        - ui_test_output
        - video
        - audio
  min_sizes:
    screenshot: 1000
    email: 100
    api_response: 10
    log: 10
    test_output: 10
    video: 10000
    audio: 1000

# Adversary Gate — Validate real test output
# Used by post_bash.py
adversary_gate:
  test_patterns:
    - framework: "pytest"
      pass_pattern: "passed"
      fail_pattern: "FAILED|ERROR"
    - framework: "jest"
      pass_pattern: "Tests:.*passed"
      fail_pattern: "Tests:.*failed"
    - framework: "xcodebuild"
      pass_pattern: "\\*\\* TEST SUCCEEDED \\*\\*"
      fail_pattern: "\\*\\* TEST FAILED \\*\\*"
    - framework: "go_test"
      pass_pattern: "^ok\\s+"
      fail_pattern: "^FAIL\\s+"
    - framework: "cargo_test"
      pass_pattern: "test result: ok"
      fail_pattern: "test result: FAILED"

# ADR Reflection Gate — enforce filled "## Architektur-Entscheidung (ADR)" at spec approval
# Used by workflow.py _check_adr (phase3→4). Set enabled: false to opt out.
adr_gate:
  enabled: true

# PO-Briefing-Gate (Freigabe Phase 3 -> 4)
# Die Freigabe verlangt ein unabhaengig erstelltes Briefing (po-briefer Agent),
# registriert via `workflow.py set-briefing <pfad>`. Das Briefing ist per
# SHA-256 an die gelesene Spec-Fassung gebunden: aendert sich die Spec danach,
# blockiert das Gate erneut.
po_briefing_gate:
  enabled: true
  # Fast-Track-Workflows (feature-fast, bug) brauchen per Default kein Briefing.
  skip_fast_track: true
  # Wortgrenze für die Pflicht-Abschnitte + Freigabe-Frage. Der po-briefer zielt
  # auf ≤ 120 Wörter; darüber blockt das Gate ("Briefing zu lang").
  max_words: 150

# CI-Spec-Gate (scripts/ci_spec_gate.py, laeuft im Pull Request)
# Prueft serverseitig, was die lokalen Hooks nur lokal erzwingen: Spec zum
# Code-Change vorhanden und vollstaendig, PO-Briefing vorhanden, vollstaendig
# und aktuell. Aussteigen fuer einen einzelnen PR: Commit-Trailer
# `Spec-Gate: skip <Grund>` — sichtbar in der Historie.
ci_spec_gate:
  enabled: true

# Specs Configuration
specs:
  base_path: "docs/specs"
  template_file: "docs/specs/_template.md"
  categories:
    modules:
      pattern: "^class\\s+(\\w+)"
      path: "modules"
    functions:
      pattern: "^def\\s+(\\w+)"
      path: "functions"
    tests:
      pattern: "^def\\s+test_(\\w+)"
      path: "tests"

# Agent Configuration
# Model Strategy: Haiku (mechanical) / Sonnet (creative) / Opus (core, main context)
agents:
  default_model: "sonnet"
  spec_writer:
    model: "sonnet"
    enabled: true
  spec_validator:
    model: "haiku"
    enabled: true
  docs_updater:
    model: "sonnet"
    enabled: true
  bug_intake:
    model: "haiku"
    enabled: true
  bug_investigator:
    model: "sonnet"
    enabled: true
  test_runner:
    model: "haiku"
    enabled: true
  feature_planner:
    model: "sonnet"
    enabled: true
  user_story_planner:
    model: "opus"
    enabled: true
  implementation_validator:
    model: "sonnet"
    enabled: true

# Domain-specific modules (installed via setup.py --module)
modules:
  ios_swiftui:
    enabled: false
  home_assistant:
    enabled: false
