name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pyyaml
      - name: Run test suite
        run: python3 -m pytest tests/ -q

  spec-gate:
    # Serverseitige Nachpruefung: lokale Hooks sind abschaltbar, und
    # .claude/workflows/ ist gitignored — die CI sieht nur committete Dateien.
    # Aussteigen fuer einen einzelnen PR: Commit-Trailer 'Spec-Gate: skip <Grund>'.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec- und Briefing-Gate
        run: |
          python3 scripts/ci_spec_gate.py \
            --base "origin/${{ github.event.pull_request.base.ref }}"
